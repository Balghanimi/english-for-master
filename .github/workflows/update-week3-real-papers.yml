name: Update Week 3 Real-Paper Tense Map
on:
  push:
    paths:
      - '.github/workflows/update-week3-real-papers.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace Week 3 with reviewed real-paper version
        shell: bash
        run: |
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          data = ''
          Path('week03.html').write_bytes(zlib.decompress(base64.b64decode(data)))
          PY
      - name: Commit Week 3 update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add week03.html
          git diff --cached --quiet || git commit -m 'Add real-paper tense map to Week 3'
          git push

name: Fix Week 2 Runtime
on:
  push:
    paths:
      - '.github/workflows/fix-week2-runtime.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/fix_week2_runtime.py
      - run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          s=BeautifulSoup(Path('week02.html').read_text(encoding='utf-8'),'html.parser')
          js=s.find_all('script')[-1].string or s.find_all('script')[-1].get_text()
          Path('/tmp/week02.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/week02.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add week02.html
          git diff --cached --quiet || git commit -m 'Repair Week 2 solution buttons and simplify student timing'
          git push

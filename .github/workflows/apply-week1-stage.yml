name: Apply staged Week 1

on:
  push:
    paths:
      - '.stage/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged Week 1
        shell: bash
        run: |
          if [ ! -f .stage/READY ]; then
            echo "No staged update to apply."
            exit 0
          fi
          cat .stage/week01.part* > week01.html
          rm -rf .stage
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enhance Week 1 practice and sticky navigation"
          git push

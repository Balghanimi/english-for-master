name: Upgrade Week 2

on:
  push:
    paths:
      - '.github/workflows/upgrade-week2.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/upgrade_week2.py
      - name: Commit Week 2 update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add week02.html
          if git diff --cached --quiet; then
            echo 'No Week 2 changes to commit.'
          else
            git commit -m 'Add Week 2 solutions, key words, and mixed examples'
            git push
          fi

name: Fix Week 2 Source Alignment
on:
  push:
    paths:
      - '.github/workflows/fix-week2-source.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/fix_week2_source.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add week02.html
          git diff --cached --quiet || git commit -m 'Fix Week 2 answers and align with source lecture'
          git push
